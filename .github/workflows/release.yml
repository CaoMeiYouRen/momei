name: Release
on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:
  schedule:
    # 每周六 UTC+0 12:00 即 UTC+8 20:00
    - cron: "0 12 * * 6"
# 仅针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Release 作业不取消，因为要确保版本发布成功
jobs:
  regression:
    name: Pre-check & Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 135  # 15 (precheck) + 120 (regression)
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile

      # ── Phase 1: Pre-check ──────────────────────────────
      - name: Run shared CI pre-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: pnpm run ci:precheck -- --profile=release
      - name: Upload pre-check artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-precheck-release
          path: |
            artifacts/review-gate/*-ci-precheck-release.md
            artifacts/review-gate/*-ci-precheck-release.json
          if-no-files-found: warn

      # ── Phase 2: Regression ─────────────────────────────
      # Build api-client & mcp-server first so `nuxt typecheck` can resolve type declarations
      - name: Build api-client dependency
        run: pnpm --filter @momei-blog/api-client build
      - name: Build mcp-server dependency
        run: pnpm --filter momei-mcp-server build
      - name: Run pre-release regression gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run regression:pre-release
      - name: Upload regression gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-pre-release
          path: |
            artifacts/review-gate/*-pre-release-regression.md
            artifacts/review-gate/*-pre-release-regression.json
            artifacts/review-gate/*-pre-release.md
          if-no-files-found: warn

  release:
    name: Release
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write          # OIDC for npm publish
      packages: write
      contents: write
      issues: write
      pull-requests: write
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0        # semantic-release 和 changesets 都需要完整 git 历史
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm i --frozen-lockfile

      # 步骤 1：semantic-release — 根包版本 + CHANGELOG + GitHub Release
      - name: Semantic Release (root)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release:semantic

      # 步骤 2：changeset publish — 子包版本 + CHANGELOG + npm publish
      - name: Build sub-packages
        run: pnpm -r --filter "./packages/*" build
      - name: Changeset Publish (packages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 无需 NPM_TOKEN — 通过 OIDC 自动认证
        run: pnpm changeset publish

      # 步骤 3：Docker build — 基于 semantic-release 的 git tag
      # 发布到 docker
      - name: Get git tag
        id: git_tag
        run: |
          GIT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          echo "tag=$GIT_TAG" >> ${GITHUB_OUTPUT}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # 阿里云 ACR 属于可选发布目标：登录失败时降级为仅发布 docker.io / ghcr.io，
      # 避免第三方 registry 网络抖动阻断全部镜像发布。
      - name: Login to Alibaba Cloud Container Registry
        id: login_aliyun
        continue-on-error: true
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if log=$(printf '%s' "$ALIYUN_PASSWORD" | timeout 60 docker login registry.cn-hangzhou.aliyuncs.com --username "$ALIYUN_USERNAME" --password-stdin 2>&1); then
              echo "$log"
              echo "阿里云 ACR 登录成功（第 ${attempt} 次尝试）"
              echo "status=ok" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "$log"
            if printf '%s' "$log" | grep -Eiq 'unauthorized|40[13]|forbidden|access ?denied|authentication required|incorrect username or password|wrong username or password|denied:'; then
              echo "::error::阿里云 ACR 鉴权失败，疑似凭据失效或权限变更（非网络问题）"
              echo "status=auth_failed" >> "${GITHUB_OUTPUT}"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::阿里云 ACR 登录失败（第 ${attempt}/3 次尝试），10 秒后重试"
              sleep 10
            fi
          done
          echo "::error::阿里云 ACR 登录连续 3 次失败（网络类错误），本次跳过 ACR 发布目标"
          echo "status=network_failed" >> "${GITHUB_OUTPUT}"
          exit 1
      # 凭据失效属于配置错误，必须硬失败，避免 ACR 长期静默缺更。
      - name: Fail fast on invalid Alibaba Cloud credentials
        if: ${{ steps.login_aliyun.outputs.status == 'auth_failed' }}
        run: |
          echo "::error::阿里云 ACR 凭据无效，发布中止（请检查 ALIYUN_USERNAME / ALIYUN_PASSWORD）"
          exit 1
      - name: Resolve registry targets
        id: registries
        env:
          ACR_AVAILABLE: ${{ steps.login_aliyun.outputs.status == 'ok' }}
        run: |
          images=$(printf '%s\n%s' "${GITHUB_REPOSITORY}" "ghcr.io/${GITHUB_REPOSITORY}")
          if [ "$ACR_AVAILABLE" = "true" ]; then
            images=$(printf '%s\n%s' "${images}" "registry.cn-hangzhou.aliyuncs.com/${GITHUB_REPOSITORY}")
          else
            echo "::warning::阿里云 ACR 不可用，本次仅发布 docker.io 与 ghcr.io"
          fi
          {
            echo 'images<<EOF'
            echo "${images}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          # 发布到 docker.io / ghcr.io；阿里云 ACR 可用时一并发布
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,priority=1100,pattern={{version}},value=${{ steps.git_tag.outputs.tag }},enable=true
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
          flavor: latest=false
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        # 如果有 GIT_TAG ，就发布
        if: ${{ steps.git_tag.outputs.tag != '' }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # 阿里云 ACR 不支持 OCI attestation manifest（application/vnd.oci.empty.v1+json），
          # 多架构构建默认注入的 provenance/sbom attestation 会导致 push 被拒绝，故显式禁用。
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
