name: Release
on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:
  schedule:
    # 每周六 UTC+0 12:00 即 UTC+8 20:00
    - cron: "0 12 * * 6"
# 仅针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Release 作业不取消，因为要确保版本发布成功
jobs:
  regression:
    name: Pre-check & Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 140  # ≈2 (security gate) + 15 (precheck) + 120 (regression)
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile

      # ── Security gate: Dependabot / Code Scanning ───────
      # 规范见 docs/standards/security.md §5.3：critical 必须修复且不可豁免，
      # high 仅在无可用补丁或修复难度过大时登记例外。独立成步以便快速失败与定位；
      # 与 release:check:full 内的同名门禁构成双跑，此处用于在重回归之前先给出结论。
      - name: Run security alert gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run security:alerts
      - name: Upload security alert evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-alerts
          path: artifacts/review-gate/*-security-alerts.*
          if-no-files-found: warn

      # ── Phase 1: Pre-check ──────────────────────────────
      # AI 治理检查需要一个已初始化的平台镜像（`.claude/skills` 等由本脚本按主定义建链接）。
      # 这些链接在 `.gitignore` 中，checkout 后不存在；缺目录会让 ai:check 以 ENOENT 直接失败
      # （2026-11-07 / 11-08 两次 Release 均因此被预检拦下）。
      - name: Setup AI mirrors
        run: node scripts/setup/setup-ai.mjs
      - name: Run shared CI pre-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: pnpm run ci:precheck -- --profile=release
      - name: Upload pre-check artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-precheck-release
          path: |
            artifacts/review-gate/*-ci-precheck-release.md
            artifacts/review-gate/*-ci-precheck-release.json
          if-no-files-found: warn

      # ── Phase 2: Regression ─────────────────────────────
      # Build api-client & mcp-server first so `nuxt typecheck` can resolve type declarations
      - name: Build api-client dependency
        run: pnpm --filter @momei-blog/api-client build
      - name: Build mcp-server dependency
        run: pnpm --filter momei-mcp-server build
      - name: Run pre-release regression gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run regression:pre-release
      - name: Upload regression gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-pre-release
          path: |
            artifacts/review-gate/*-pre-release-regression.md
            artifacts/review-gate/*-pre-release-regression.json
            artifacts/review-gate/*-pre-release.md
          if-no-files-found: warn

  release:
    name: Release
    needs: regression
    runs-on: ubuntu-latest
    # 镜像构建已移出本 job（改由 docker.yml 的原生 matrix 完成），这里只保留
    # semantic-release + 子包发布 + 派发镜像构建的预算。
    timeout-minutes: 60
    permissions:
      id-token: write          # OIDC for npm publish
      contents: write
      issues: write
      pull-requests: write
      security-events: read
      # workflow_dispatch docker.yml（发布后派发镜像构建）需要 actions 写权限
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0        # semantic-release 和 changesets 都需要完整 git 历史
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm i --frozen-lockfile

      # 步骤 1：semantic-release — 根包版本 + CHANGELOG + GitHub Release
      - name: Semantic Release (root)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release:semantic

      # 步骤 2：changeset publish — 子包版本 + CHANGELOG + npm publish
      - name: Build sub-packages
        run: pnpm -r --filter "./packages/*" build
      - name: Changeset Publish (packages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 无需 NPM_TOKEN — 通过 OIDC 自动认证
        run: pnpm changeset publish

      # 步骤 3：派发镜像构建 — 基于 semantic-release 创建的 git tag
      # 多架构镜像由 docker.yml 的原生 matrix（amd64 → ubuntu-latest / arm64 → ubuntu-24.04-arm）
      # + digest merge 完成，不再占用本 job 的预算，也不再使用 QEMU 模拟 arm64。
      # `--ref <tag>` 把构建钉在发布提交上（GITHUB_SHA = tag 指向的 commit），避免用 master
      # 当前 HEAD 构建导致镜像内容与版本不符；tag 上必须存在本工作流文件（首次迁移后的新 tag 起生效）。
      - name: Get git tag
        id: git_tag
        run: |
          # 只取根版本 tag：changeset publish 会在同一 HEAD 上创建包级 tag
          # （如 @momei-blog/api-client@0.2.0），不能用 git describe 的任意 exact-match 结果。
          GIT_TAG=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null || true)
          echo "tag=$GIT_TAG" >> ${GITHUB_OUTPUT}
      - name: Trigger Docker build for release tag
        if: ${{ steps.git_tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.git_tag.outputs.tag }}
        run: |
          set -euo pipefail
          # metadata-action 的 semver 类型接受带不带 v 前缀的版本号
          VERSION="${RELEASE_TAG#v}"
          # 回查键必须是 tag 指向的 commit：semantic-release 在本 job 内新建了 release commit，
          # 而本 job 的 GITHUB_SHA 仍是发布前的 master HEAD，两者不同。
          TARGET_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          echo "dispatch docker.yml --ref ${RELEASE_TAG} -f version=${VERSION} (${TARGET_SHA})"
          gh workflow run docker.yml --ref "${RELEASE_TAG}" -f version="${VERSION}"
          # 派发只负责创建 run：镜像构建结果在 docker.yml 的 run 内查看，本 job 不阻塞等待
          # （避免把多架构构建预算搬回 release job）。这里回查并输出 run 链接，便于发布后核对；
          # 60 秒内查不到只告警，不改变 release 结论（run 可能仍在排队创建）。
          for _ in $(seq 1 12); do
            run_url=$(gh run list --workflow=docker.yml --event=workflow_dispatch --limit 20 \
              --json url,headSha \
              --jq "[.[] | select(.headSha == \"${TARGET_SHA}\")][0].url // empty" 2>/dev/null || true)
            if [ -n "${run_url}" ]; then
              echo "::notice::镜像构建已派发（${RELEASE_TAG}）：${run_url}"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::已派发 docker.yml，但 60 秒内未在 run 列表中找到对应记录，请到 Actions 页面核对"
      - name: Skip notice when no release tag
        if: ${{ steps.git_tag.outputs.tag == '' }}
        run: echo "::notice::HEAD 上没有 exact-match tag（本轮无版本发布），跳过镜像构建派发"
