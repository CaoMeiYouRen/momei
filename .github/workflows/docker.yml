name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - master

# 仅取消针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Pre-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - name: Run shared CI pre-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: pnpm run ci:precheck -- --profile=docker
      - name: Upload pre-check artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-precheck-docker
          path: |
            artifacts/review-gate/*-ci-precheck-docker.md
            artifacts/review-gate/*-ci-precheck-docker.json
          if-no-files-found: warn

  qa:
    name: QA
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # Build api-client first so nuxt typecheck resolves its type declarations
      - name: Build api-client dependency
        run: pnpm --filter @momei-blog/api-client build
      - name: Build mcp-server dependency
        run: pnpm --filter momei-mcp-server build
      - run: pnpm run lint
      - run: pnpm run lint:i18n
      - run: pnpm run lint:css
      - run: pnpm run typecheck
  unit:
    name: Unit
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # Build api-client + mcp-server first so dependent packages can resolve them
      - name: Build api-client dependency
        run: pnpm --filter @momei-blog/api-client build
      - name: Build mcp-server dependency
        run: pnpm --filter momei-mcp-server build
      - run: pnpm run test
  build:
    needs: [qa, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      - name: Get short commit hash
        run: echo "TAG=sha-${GITHUB_SHA::7}" >>${GITHUB_ENV}
      # ── 原生多架构构建 ─────────────────────────────────────
      # 直接使用原始 Dockerfile，让 Buildx + QEMU 在各目标平台上
      # 完整执行 pnpm install → build，确保原生模块（如 better-sqlite3）
      # 针对各架构正确编译，避免预构建 x86_64 产物跨平台兼容问题。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # 阿里云 ACR 属于可选发布目标：登录失败时降级为仅发布 docker.io / ghcr.io，
      # 避免第三方 registry 网络抖动阻断全部镜像发布。
      - name: Login to Alibaba Cloud Container Registry
        id: login_aliyun
        continue-on-error: true
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if log=$(printf '%s' "$ALIYUN_PASSWORD" | timeout 60 docker login registry.cn-hangzhou.aliyuncs.com --username "$ALIYUN_USERNAME" --password-stdin 2>&1); then
              echo "$log"
              echo "阿里云 ACR 登录成功（第 ${attempt} 次尝试）"
              echo "status=ok" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "$log"
            if printf '%s' "$log" | grep -Eiq 'unauthorized|40[13]|forbidden|access ?denied|authentication required|incorrect username or password|wrong username or password|denied:'; then
              echo "::error::阿里云 ACR 鉴权失败，疑似凭据失效或权限变更（非网络问题）"
              echo "status=auth_failed" >> "${GITHUB_OUTPUT}"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::阿里云 ACR 登录失败（第 ${attempt}/3 次尝试），10 秒后重试"
              sleep 10
            fi
          done
          echo "::error::阿里云 ACR 登录连续 3 次失败（网络类错误），本次跳过 ACR 发布目标"
          echo "status=network_failed" >> "${GITHUB_OUTPUT}"
          exit 1
      # 凭据失效属于配置错误，必须硬失败，避免 ACR 长期静默缺更。
      - name: Fail fast on invalid Alibaba Cloud credentials
        if: ${{ steps.login_aliyun.outputs.status == 'auth_failed' }}
        run: |
          echo "::error::阿里云 ACR 凭据无效，发布中止（请检查 ALIYUN_USERNAME / ALIYUN_PASSWORD）"
          exit 1
      - name: Resolve registry targets
        id: registries
        env:
          ACR_AVAILABLE: ${{ steps.login_aliyun.outputs.status == 'ok' }}
        run: |
          images=$(printf '%s\n%s' "${GITHUB_REPOSITORY}" "ghcr.io/${GITHUB_REPOSITORY}")
          if [ "$ACR_AVAILABLE" = "true" ]; then
            images=$(printf '%s\n%s' "${images}" "registry.cn-hangzhou.aliyuncs.com/${GITHUB_REPOSITORY}")
          else
            echo "::warning::阿里云 ACR 不可用，本次仅发布 docker.io 与 ghcr.io"
          fi
          {
            echo 'images<<EOF'
            echo "${images}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          # 发布到 docker.io / ghcr.io；阿里云 ACR 可用时一并发布
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
          flavor: latest=false
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          # 使用原始 Dockerfile，Buildx + QEMU 为各平台原生编译
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # 阿里云 ACR 不支持 OCI attestation manifest（application/vnd.oci.empty.v1+json），
          # 多架构构建默认注入的 provenance/sbom attestation 会导致 push 被拒绝，故显式禁用。
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Hub README & description sync
        uses: meeDamian/sync-readme@v1.0.6
        with:
          user: ${{ secrets.DOCKER_USERNAME }}
          pass: ${{ secrets.DOCKER_PASSWORD }}
          slug: ${{ github.repository }}
          description: "墨梅博客-AI驱动、原生国际化的开发者博客平台"
      - name: Deploy to Jenkins
        if: ${{ github.repository == 'CaoMeiYouRen/momei' }}
        run: curl -X GET -L --user ${{ secrets.JENKINS_TOKEN }} "${{ secrets.JENKINS_URL }}/job/momei/buildWithParameters?token=${{ secrets.JENKINS_JOB_TOKEN }}&DOCKER_IMAGE=${{ env.REPO }}:${{ env.TAG }}"
      - name: Deploy Demo to Jenkins
        if: ${{ github.repository == 'CaoMeiYouRen/momei' }}
        run: curl -X GET -L --user ${{ secrets.JENKINS_DEMO_TOKEN }} "${{secrets.JENKINS_DEMO_URL}}/job/momei-demo/buildWithParameters?token=${{secrets.JENKINS_DEMO_JOB_TOKEN }}&DOCKER_IMAGE=${{ env.REPO }}:${{env.TAG }}"
