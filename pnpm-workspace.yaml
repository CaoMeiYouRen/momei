packages:
    - "packages/*"

# Keep a short quarantine window for newly published packages,
# but avoid blocking normal lockfile maintenance for same-day releases.
minimumReleaseAge: 60

allowBuilds:
    "@parcel/watcher": true
    "@sentry/cli": true
    better-sqlite3: true
    esbuild: true
    nice-napi: true
    protobufjs: true
    sharp: true
    unrs-resolver: true
    vue-demi: true
    workerd: true

overrides:
    deepmerge-ts: "^8.0.0"
    # `nuxt` 与 `@nuxt/nitro-server` 都以「精确版本」声明 `@nuxt/kit`，而第三方 Nuxt
    # 模块声明的是 `^3.x` / `^4.x` 宽范围。此 override 只应承担「把第三方 3.x 消费者
    # 抬到 4.x 线」的职责，绝不能让 kit 跨到 nuxt 未要求的次版本：Nuxt 运行时会按自身
    # 主次版本从 `@nuxt/kit` 取对应的内部符号与子路径导出（4.5 线用 `bundlerDiagnostics`、
    # 4.6 线用 `./internal`），kit 次版本一旦与 nuxt 不一致，`nuxt prepare`（root
    # postinstall）会直接以「缺少导出 / 子路径未定义」失败。
    # 因此**本行与 package.json 的 `nuxt` 版本必须同一次原子变更**：拆分抬升会让
    # nuxt 升级类 PR 在 postinstall 阶段长期转红（tests/modules/nuxt-kit-version-lockstep.test.ts
    # 亦会拦截 kit 与 nuxt 版本线不一致）。
    # 必须是**精确版本**而非 `~4.6.0` 这类区间：pnpm 会**复用**锁文件中仍满足区间的既有解析，
    # 不会主动把同一主次线内的多个补丁位收敛为一个。锁文件一旦已并存 4.6.0 / 4.6.1 两个实例
    # （依赖 PR 重解析留下的产物），保持区间不变的重解析不会自愈（实测产物逐字节不变）。
    # 精确版本会让不再满足的陈旧条目失效，从而强制收敛为单一实例——这正是
    # tests/modules/nuxt-kit-version-lockstep.test.ts 要求的「kit 单一实例」不变量。
    "@nuxt/kit": "4.6.1"
    axios: "^1.20.0"
    js-cookie: "^3.0.7"
    samlify: "^2.13.0"
    basic-ftp: "^6.2.1"
    fast-xml-parser: "^5.8.0"
    follow-redirects: "^1.16.0"
    # 以下两项只经 @lhci/cli 触达（devDependencies，仅本地 / CI 执行 Lighthouse 性能审计）。
    proxy-addr: "^2.0.8"
    compression: "^1.8.2"
    "@smithy/types": "^4.13.1"
    file-type: "^21.3.2"
    preact: "^10.28.2"
    vite: "8.0.16"
    esbuild: "^0.28.1"
    brace-expansion: "^5.0.11"
    tar: "^7.5.16"
    minimatch: "^10.2.3"
    source-map-js: "^1.2.2"
    html-minifier: "npm:html-minifier-terser@^7.2.0"
    handlebars: "^4.7.10"
    # node-forge 上游最新版本即 1.4.0，GHSA-86w9-cpqp-85rv 要求的 >=1.4.1 并不存在，
    # 无法通过升级规避，改由 .github/security/dependency-risk-allowlist.json 登记临时例外。
    node-forge: "^1.4.0"
    js-yaml: "^4.3.2"
    "read-yaml-file>js-yaml": "^3.14.1"
    tmp: "^0.2.7"
    debug: "^4.4.0"
    undici: "^6.28.1"
    diff: "^9.0.0"
    devalue: "^5.9.3"
    defu: "6.1.5"
    unhead: "^3.2.2"
    qs: "6.15.2"
    hono: "^4.12.27"
    "@hono/node-server": "^2.0.5"
    uuid: "11.1.1"
    "@nuxt/test-utils>h3-next": "npm:h3@^2.0.1-rc.18"
    seroval: "^1.4.1"
    # GHSA-x6jw-m9v5-85vh（critical）的补丁只在 simple-git 4.x 线提供（3.36.1 未发布），故跨大版本抬升。
    # simple-git 仅经 nuxt > @nuxt/devtools 在开发 / 构建期被触达，不进入生产运行时依赖图。
    # ⚠️ 已知代价：@nuxt/devtools 声明的是 `simple-git: ^3.36.0`，而 4.x 移除了 default 导出，
    # devtools 的 module-main chunk 以 `import Git from 'simple-git'` 加载会抛
    # `SyntaxError: does not provide an export named 'default'`。当前依赖 nuxt.config.ts 的
    # `devtools: { enabled: false }` 规避（setup 提前 return，不会加载该 chunk）；
    # 一旦开启 devtools 会直接失败，届时须先确认 devtools 已支持 simple-git 4 再放开。
    simple-git: "^4.0.2"
    "@simple-git/argv-parser": "^2.0.1"
    immutable: "^5.1.5"
    "path-to-regexp@0.1.12": "^0.1.13"
    "path-to-regexp@8.3.0": "^8.4.0"
    "picomatch@2.3.1": "^2.3.2"
    "picomatch@4.0.3": "^4.0.4"
    svgo: "^4.1.0"
    "body-parser@1": "^1.20.6"
    "body-parser@2": "^2.3.0"
    lodash: "^4.18.1"
    "ajv@^6.0.0": "^6.14.0"
    "ajv@^8.0.0": "^8.18.0"
    rollup: "^4.59.0"
    serialize-javascript: "^7.0.5"
    shell-quote: "^1.12.0"
    "@xmldom/xmldom": "^0.8.15"
    yauzl: "^3.2.1"
    flatted: "^3.4.2"
    kysely: "^0.28.17"
    srvx: "^0.11.13"
    yaml: "^2.8.3"
    ip-address: "^10.1.1"
    "push-all-in-one>nodemailer": "^10.0.6"
    form-data: "^4.0.6"
    ws: "^8.21.0"
    typescript-eslint: "8.63.0"
    sharp: "^0.35.5"
    fast-uri: "^3.1.6"
    "piscina": "^4.9.3"
    "@babel/plugin-transform-modules-systemjs": "^7.29.4"
    launch-editor: "^2.14.1"
